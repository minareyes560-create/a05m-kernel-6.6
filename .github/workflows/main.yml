name: Compile Galaxy A05 Base Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev \
          libelf-dev xz-utils liblz4-tool ccache pahole clang lld llvm

    - name: Prepare KernelSU & Clean AFDO
      run: |
        cd kernel-6.6
        rm -rf drivers/kernelsu
        mkdir -p drivers/kernelsu
        touch drivers/kernelsu/Kconfig
        touch drivers/kernelsu/Makefile
        if ! grep -q "kernelsu/" drivers/Makefile; then
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
        fi

        grep -rl "kernel.afdo" . | xargs -r sed -i 's/.*kernel.afdo.*/# AFDO removed/g'
        grep -rl "fprofile-sample-use" . | xargs -r sed -i 's/-fprofile-sample-use=[^ ]*//g'

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        cd kernel-6.6
        
        DEFCONFIG_NAME=$(basename $(find arch/arm64/configs -name "*defconfig" | head -n 1))
        
        make ARCH=arm64 CC=clang LD=ld.lld LLVM=1 ${DEFCONFIG_NAME}
        
        scripts/config --file .config --disable CONFIG_AFDO_PROFILE
        scripts/config --file .config --disable CONFIG_LTO_CLANG_THIN
        scripts/config --file .config --disable CONFIG_LTO_CLANG_FULL
        scripts/config --file .config --enable CONFIG_LTO_NONE
        scripts/config --file .config --disable CONFIG_WERROR
        
        make ARCH=arm64 CC=clang LD=ld.lld LLVM=1 olddefconfig
        make -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 KCFLAGS="-w"

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: A05-Kernel-Image-Base
        path: |
          kernel-6.6/arch/arm64/boot/Image.gz
          kernel-6.6/arch/arm64/boot/Image
