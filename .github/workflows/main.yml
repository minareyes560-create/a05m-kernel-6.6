name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget python3 rsync

      - name: Descargar Toolchain Clang de Android
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-releases/clang-r450784d.tar.gz -O clang.tar.gz || \
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Configurar drivers y Compilar Kernel directamente
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          echo "Usando binarios desde: $HOME/clang/bin"
          
          # Entrar automáticamente al directorio raíz real del kernel donde esté el Makefile principal
          KERNEL_DIR=$(find . -maxdepth 4 -name "Makefile" -exec grep -l "VERSION =" {} + | head -n 1 | xargs dirname)
          if [ -n "$KERNEL_DIR" ]; then
            echo "Entrando a: $KERNEL_DIR"
            cd "$KERNEL_DIR"
          fi
          
          # Limpiar rastros de KernelSU
          rm -rf drivers/kernelsu || true
          if [ -f "drivers/Makefile" ]; then
            sed -i '/kernelsu/d' drivers/Makefile || true
          fi
          if [ -f "drivers/Kconfig" ]; then
            sed -i '/kernelsu/d' drivers/Kconfig || true
          fi

          # Limpieza general sin arriesgar dependencias de arquitectura
          make ARCH=arm64 clean
          
          # Cargar configuración base GKI
          make ARCH=arm64 gki_defconfig
          
          # Inyectar soporte para Wi-Fi, modo monitor y drivers mt76 directamente
          {
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_MT76_CORE=y"
            echo "CONFIG_MT76_USB=y"
            echo "CONFIG_MT7921U=y"
          } >> .config
          
          # Actualizar configuración del kernel
          make ARCH=arm64 olddefconfig
          
          # Compilar la imagen evitando tareas innecesarias de cabeceras de usuario
          make -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: |
            **/arch/arm64/boot/Image.lz4
            **/arch/arm64/boot/Image
        if: always()
