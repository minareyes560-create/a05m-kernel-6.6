name: Compile Galaxy A05 Base Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libelf-dev xz-utils liblz4-tool ccache pahole

    - run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b clang-toolchain

    - run: |
        cd kernel-6.6
        rm -rf drivers/kernelsu
        mkdir -p drivers/kernelsu
        touch drivers/kernelsu/Kconfig
        if ! grep -q "kernelsu/" drivers/Makefile; then
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
        fi

    - run: |
        export PATH=$(pwd)/clang-toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        cd kernel-6.6
        DEFCONFIG_NAME=$(basename $(find arch/arm64/configs -name "*defconfig" | head -n 1))
        make CC=clang LD=ld.lld ${DEFCONFIG_NAME}
        make -j$(nproc) CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

    - uses: actions/upload-artifact@v4
      with:
        name: A05-Kernel-Image-Base
        path: kernel-6.6/arch/arm64/boot/Image.gz
