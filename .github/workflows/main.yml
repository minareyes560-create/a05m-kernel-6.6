name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget python3 rsync cpio

      - name: Descargar Toolchain Clang de Android
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-releases/clang-r450784d.tar.gz -O clang.tar.gz || \
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Configurar drivers y Compilar Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          echo "Usando binarios desde: $HOME/clang/bin"
          
          # Ubicar el directorio raíz real del kernel
          KERNEL_DIR=$(find . -maxdepth 4 -name "Makefile" -exec grep -l "VERSION =" {} + | head -n 1 | xargs dirname)
          if [ -n "$KERNEL_DIR" ]; then
            echo "Entrando a: $KERNEL_DIR"
            cd "$KERNEL_DIR"
          fi
          
          # Eliminar completamente la carpeta de KernelSU y limpiar todas sus referencias internas
          rm -rf drivers/kernelsu || true
          
          # Limpieza profunda mediante Python para asegurar que ningún Kconfig o Makefile busque archivos inexistentes
          python3 -c "
          import glob
          for filepath in glob.glob('drivers/**/Kconfig', recursive=True) + glob.glob('drivers/**/Makefile', recursive=True):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  if 'kernelsu' in content.lower():
                      new_content = '\n'.join([line for line in content.splitlines() if 'kernelsu' not in line.lower()])
                      with open(filepath, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      print(f'Referencias eliminadas en: {filepath}')
              except Exception as e:
                  print(f'Error en {filepath}: {e}')
          "

          # Si el repositorio incluye el script oficial build.sh de Android, usarlo directamente
          if [ -f "build.sh" ]; then
            echo "Script build.sh detectado. Compilando mediante el método oficial..."
            export ARCH=arm64
            export CC=clang
            export LD=ld.lld
            export LLVM=1
            export LLVM_IAS=1
            ./build.sh
          else
            echo "Usando compilación estándar con preparación de cabeceras..."
            make ARCH=arm64 clean
            make ARCH=arm64 gki_defconfig
            
            # Inyectar soporte para Wi-Fi, modo monitor y drivers mt76
            {
              echo "CONFIG_NETDEVICES=y"
              echo "CONFIG_WLAN=y"
              echo "CONFIG_NL80211_TESTMODE=y"
              echo "CONFIG_CFG80211=y"
              echo "CONFIG_MAC80211=y"
              echo "CONFIG_MT76_CORE=y"
              echo "CONFIG_MT76_USB=y"
              echo "CONFIG_MT7921U=y"
            } >> .config
            
            make ARCH=arm64 olddefconfig
            
            # Preparar cabeceras y submódulos antes de compilar Image
            make -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
            make -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- Image
          fi

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: |
            **/arch/arm64/boot/Image.lz4
            **/arch/arm64/boot/Image
            **/out/arch/arm64/boot/Image
        if: always()
