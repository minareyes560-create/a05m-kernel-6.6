name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev

      - name: Descargar Toolchain Clang
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b main $HOME/clang

      - name: Configurar drivers Panda AXE3000 (mt76) y Compilar Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          echo "Usando binarios desde: $HOME/clang/bin"
          
          # Entrar al directorio del kernel (ajusta el nombre si tu carpeta es diferente)
          cd kernel-6.6 || cd kernel || cd .
          
          # Limpiar configuraciones previas si las hubiera
          make mrproper
          
          # Configuración base GKI para ARM64
          make ARCH=arm64 gki_defconfig
          
          # Inyectar soporte para Wi-Fi, modo monitor y drivers mt76
          {
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_CFG80211=m"
            echo "CONFIG_MAC80211=m"
            echo "CONFIG_MT76_CORE=m"
            echo "CONFIG_MT76_USB=m"
            echo "CONFIG_MT7921U=m"
          } >> .config
          
          # Actualizar el archivo de configuración con los nuevos valores
          make olddefconfig ARCH=arm64
          
          # Compilar el kernel usando Clang
          make -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: |
            **/out/arch/arm64/boot/Image.lz4
            **/arch/arm64/boot/Image.lz4
            **/out/arch/arm64/boot/Image
            **/arch/arm64/boot/Image
        if: always()
