name: Compilar Kernel Samsung A05 - Modo Monitor Nativomt76

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio del Kernel
        uses: actions/checkout@v4

      - name: Instalación de dependencias y Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl python3 python-is-python3 clang linux-firmware

      - name: Inyectar Configuración y Compilar
        run: |
          cd "$GITHUB_WORKSPACE"

          # 1. Localizar la raíz real del kernel principal (el nivel superior que contiene arch/ y un Makefile principal)
          KERNEL_SUBDIR=""
          for dir in $(find . -type d -name "arm64" -path "*/arch/arm64"); do
            PARENT_DIR=$(dirname $(dirname "$dir"))
            # Evitamos entrar en submódulos si existe un Makefile en el nivel superior de arriba
            if [ -f "$PARENT_DIR/Makefile" ] && [[ "$PARENT_DIR" != *kernel_device_modules* ]]; then
              KERNEL_SUBDIR="$PARENT_DIR"
              break
            fi
          done

          if [ -z "$KERNEL_SUBDIR" ]; then
            # Si no encuentra el superior, usa la ruta donde está el a05m_defconfig
            CONFIG_DIR=$(find . -name "a05m_defconfig" | head -n 1)
            KERNEL_SUBDIR=$(echo "$CONFIG_DIR" | sed 's|/arch/arm64/configs/a05m_defconfig||')
          fi

          echo "Directorio base del kernel fijo: $GITHUB_WORKSPACE/$KERNEL_SUBDIR"
          cd "$GITHUB_WORKSPACE/$KERNEL_SUBDIR"

          # 2. Limpieza y preparación
          rm -rf drivers/kernelsu || true
          find . -name "Kconfig*" -o -name "Makefile" | xargs sed -i '/kernelsu/d' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AFDO_CLANG=y/CONFIG_AFDO_CLANG=n/g' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AUTOFDO_CLANG=y/CONFIG_AUTOFDO_CLANG=n/g' || true

          make mrproper || true
          mkdir -p out

          # 3. Generar la configuración usando directamente el defconfig de a05m
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 a05m_defconfig

          # 4. Inyectar drivers mt76/mt7921u y opciones de red para Modo Monitor de forma segura
          {
            echo "CONFIG_AFDO_CLANG=n"
            echo "CONFIG_AUTOFDO_CLANG=n"
            echo "CONFIG_PROPELLER_CLANG=n"
            echo "CONFIG_PROP_AFDO_PROFILE_PATH=\"\""
            echo "CONFIG_NET=y"
            echo "CONFIG_WIRELESS=y"
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_CFG80211_REQUIRE_SIGNED_REGDB=n"
            echo "CONFIG_CFG80211_USE_KERNEL_REGDB_KEYS=n"
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_MT76_CORE=m"
            echo "CONFIG_MT76_USB=m"
            echo "CONFIG_MT76_CONNAC_LIB=m"
            echo "CONFIG_MT7921_COMMON=m"
            echo "CONFIG_MT7921U=m"
          } >> out/.config

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 prepare

          # 5. Compilar la imagen del kernel
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- Image

      - name: Empaquetar con AnyKernel3 para TWRP
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          IMAGE_PATH=$(find . -name "Image" -path "*/out/*" | head -n 1)
          cp "$IMAGE_PATH" AK3/
          
          cd AK3
          
          # Configurar propiedades del dispositivo para que AnyKernel3 lo acepte
          sed -i 's/device.name1=.*/device.name1=a05/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=a05m/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=SM-A055M/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=SM-A055/g' anykernel.sh
          
          # Forzar la ruta de la partición boot específica para MediaTek de Samsung
          sed -i 's|block=.*;|block=/dev/block/platform/bootdevice/by-name/boot;|g' anykernel.sh
          
          # Desactivar verificación estricta de slots
          sed -i 's/is_slot_device=.*/is_slot_device=0/g' anykernel.sh
          sed -i 's/ramdisk_compression=.*/ramdisk_compression=auto/g' anykernel.sh

          zip -r9 ../Kernel-A05-Panda-MonitorMode.zip * -x .git README.md *placeholder

      - name: Subir ZIP Flasheable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode-TWRP
          path: Kernel-A05-Panda-MonitorMode.zip
