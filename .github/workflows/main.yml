name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl python3 python-is-python3

      - name: Configurar drivers Panda AXE3000 (mt76) y Compilar Kernel con build.sh
        run: |
          # Entrar al directorio del kernel
          cd kernel-6.6 || cd kernel || cd .
          
          # Limpiar referencias de KernelSU y archivos residuales
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true
          rm -rf drivers/kernelsu || true
          
          # Inyectar soporte para Wi-Fi y los drivers mt76 / mt7921u en el defconfig de GKI
          {
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_CFG80211=m"
            echo "CONFIG_MAC80211=m"
            echo "CONFIG_MT76_CORE=m"
            echo "CONFIG_MT76_USB=m"
            echo "CONFIG_MT7921U=m"
          } >> arch/arm64/configs/gki_defconfig
          
          # Compilar utilizando el script oficial de Android (build.sh) que evita errores de sub-make
          # (Si el repositorio usa build/build.sh o un script similar en la raíz)
          if [ -f "build.sh" ]; then
            LEX=flex YACC=bison LDFLAGS="" BUILD_CONFIG=common/build.config.gki.aarch64 ./build.sh
          elif [ -f "common/build.sh" ]; then
            LEX=flex YACC=bison LDFLAGS="" ./common/build.sh
          else
            # Método alternativo directo si el repositorio no usa build.sh estandarizado
            make -C . O=out ARCH=arm64 gki_defconfig
            make -C . O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image
          fi

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: |
            **/out/arch/arm64/boot/Image.lz4
            **/arch/arm64/boot/Image.lz4
            **/out/arch/arm64/boot/Image
            **/out/arch/arm64/boot/Image
            **/out/kernel*
        if: always()
