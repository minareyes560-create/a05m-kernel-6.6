name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget python3 rsync cpio

      - name: Descargar Toolchain Clang de Android
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-releases/clang-r450784d.tar.gz -O clang.tar.gz || \
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Configurar drivers y Compilar Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          echo "Usando binarios desde: $HOME/clang/bin"
          
          # Ubicar el directorio raíz real del kernel
          KERNEL_DIR=$(find . -maxdepth 4 -name "Makefile" -exec grep -l "VERSION =" {} + | head -n 1 | xargs dirname)
          if [ -n "$KERNEL_DIR" ]; then
            echo "Entrando a: $KERNEL_DIR"
            cd "$KERNEL_DIR"
          fi
          
          # Eliminar KernelSU y limpiar referencias en Kconfig y Makefiles
          rm -rf drivers/kernelsu || true
          python3 -c "
          import os, glob
          target_files = ['drivers/Kconfig', 'drivers/Makefile'] + glob.glob('drivers/**/Kconfig', recursive=True) + glob.glob('drivers/**/Makefile', recursive=True)
          for path in target_files:
              if os.path.exists(path):
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                      new_lines = [line for line in lines if 'kernelsu' not in line.lower()]
                      with open(path, 'w', encoding='utf-8') as f:
                          f.writelines(new_lines)
                  except Exception:
                      pass
          "

          # Configuración limpia del Kernel GKI
          make ARCH=arm64 clean
          make ARCH=arm64 gki_defconfig
          
          # Inyectar soporte para Wi-Fi, modo monitor y drivers mt76 para la antena Panda
          {
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_MT76_CORE=y"
            echo "CONFIG_MT76_USB=y"
            echo "CONFIG_MT7921U=y"
          } >> .config
          
          make ARCH=arm64 olddefconfig
          
          # Compilar el kernel desactivando explícitamente la generación de cabeceras de usuario (HDRINST)
          make -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- SKIP_HDR_INSTALL=1 Image

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: |
            **/arch/arm64/boot/Image.lz4
            **/arch/arm64/boot/Image
            **/out/arch/arm64/boot/Image
        if: always()
