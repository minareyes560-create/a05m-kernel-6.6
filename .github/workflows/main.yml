name: Compilar Kernel Samsung A05 - Modo Monitor Nativomt76

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio del Kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias de compilacion
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make libc6-dev libncurses-dev clang lld python3 rsync

      - name: Configurar controladores MT7921U, desactivar AFDO y preparar Defconfig
        run: |
          cd "$GITHUB_WORKSPACE"
          
          # Localizar el archivo defconfig especifico del Samsung A05
          CONFIG_FILE=$(find . -name "a05m_defconfig" -o -name "a05_defconfig" | head -n 1)
          
          if [ -z "$CONFIG_FILE" ]; then
            CONFIG_FILE=$(find . -name "*defconfig" | grep -v "vendor" | grep -v "build" | head -n 1)
          fi
          
          echo "Archivo de configuracion localizado: $CONFIG_FILE"
          
          # Desactivar AFDO
          echo "CONFIG_AFDO_CLANG=n" >> "$CONFIG_FILE"
          echo "CONFIG_AUTOFDO_CLANG=n" >> "$CONFIG_FILE"
          
          # Habilitar soporte inalambrico y controladores MT7921U / MT76 para la antena Panda
          echo "CONFIG_NET=y" >> "$CONFIG_FILE"
          echo "CONFIG_WIRELESS=y" >> "$CONFIG_FILE"
          echo "CONFIG_CFG80211=y" >> "$CONFIG_FILE"
          echo "CONFIG_MAC80211=y" >> "$CONFIG_FILE"
          echo "CONFIG_USB_NET_DRIVERS=y" >> "$CONFIG_FILE"
          echo "CONFIG_MT76_CORE=m" >> "$CONFIG_FILE"
          echo "CONFIG_MT76_LEDS=y" >> "$CONFIG_FILE"
          echo "CONFIG_MT7921_COMMON=m" >> "$CONFIG_FILE"
          echo "CONFIG_MT7921U=m" >> "$CONFIG_FILE"
          echo "CONFIG_MT76_USB=m" >> "$CONFIG_FILE"
          
          # Exportar la ruta del archivo modificado
          echo "CUSTOM_CONFIG_PATH=$(realpath "$CONFIG_FILE")" >> $GITHUB_ENV
          
          # Limpiar llamadas a perfiles afdo en los Makefiles
          find . -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-fprofile-sample-use=.*//g' 2>/dev/null || true

      - name: Compilar el Kernel
        run: |
          cd "$GITHUB_WORKSPACE"
          set -e
          
          export ARCH=arm64
          export SUBARCH=arm64
          
          mkdir -p out
          
          # Copiar la configuracion personalizada como .config activo de salida
          cp -f "$CUSTOM_CONFIG_PATH" out/.config
          
          # Procesar y validar las opciones de configuracion
          make O=out ARCH=arm64 olddefconfig
          
          # Compilar la imagen del kernel
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang Image || make -j$(nproc --all) O=out ARCH=arm64 CC=clang

      - name: Empaquetar con AnyKernel3 para TWRP
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Buscar la imagen compilada del kernel
          IMAGE_PATH=$(find out/ -name "Image*" -type f 2>/dev/null | grep -v "stub" | head -n 1)
          if [ -z "$IMAGE_PATH" ]; then
            IMAGE_PATH=$(find . -name "Image*" -type f 2>/dev/null | grep -v "stub" | head -n 1)
          fi
          
          if [ -z "$IMAGE_PATH" ]; then
            echo "Error: No se encontro ninguna imagen compilada del kernel."
            exit 1
          fi
          
          echo "Imagen encontrada en: $IMAGE_PATH"
          cp "$IMAGE_PATH" AK3/Image
          
          cd AK3
          
          # Configurar propiedades del dispositivo para TWRP
          sed -i 's/device.name1=.*/device.name1=a05/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=a05m/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=SM-A055M/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=SM-A055/g' anykernel.sh
          sed -i 's|block=.*;|block=/dev/block/by-name/boot;|g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=0/g' anykernel.sh
          sed -i 's/ramdisk_compression=.*/ramdisk_compression=auto/g' anykernel.sh

          zip -r9 ../Kernel-A05-Panda-MonitorMode.zip * -x .git README.md *placeholder

      - name: Subir ZIP Flasheable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode-TWRP
          path: Kernel-A05-Panda-MonitorMode.zip
