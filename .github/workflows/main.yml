name: Compilar Kernel Samsung A05 - Modo Monitor Nativomt76

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio del Kernel
        uses: actions/checkout@v4

      - name: Configurar controladores MT7921U y desactivar AFDO
        run: |
          cd "$GITHUB_WORKSPACE"
          
          DEFCONFIG_PATH=$(find . -name "*defconfig" | grep -E "a05|mt6769|exynos|universal" | head -n 1)
          if [ -z "$DEFCONFIG_PATH" ]; then
            DEFCONFIG_PATH=$(find . -name "*defconfig" | head -n 1)
          fi
          
          echo "Archivo de configuracion localizado: $DEFCONFIG_PATH"
          
          # Desactivar AFDO
          echo "CONFIG_AFDO_CLANG=n" >> "$DEFCONFIG_PATH"
          echo "CONFIG_AUTOFDO_CLANG=n" >> "$DEFCONFIG_PATH"
          
          # Soporte inalambrico mac80211 y MT7921U / MT76
          echo "CONFIG_NET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_WIRELESS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CFG80211=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MAC80211=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_USB_NET_DRIVERS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MT76_CORE=m" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MT76_LEDS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MT7921_COMMON=m" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MT7921U=m" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MT76_USB=m" >> "$DEFCONFIG_PATH"
          
          find . -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-fprofile-sample-use=.*//g' 2>/dev/null || true

      - name: Compilar el Kernel
        run: |
          cd "$GITHUB_WORKSPACE"
          
          # Detectar el archivo defconfig
          DEFCONFIG_NAME=$(basename $(find . -name "*defconfig" | grep -E "a05|mt6769|exynos|universal" | head -n 1))
          
          # Si tienes un script de build propio en la raíz (ej: build.sh), ejecútalo.
          if [ -f "build.sh" ]; then
            bash build.sh
          else
            # Compilacion estandar con make
            make ARCH=arm64 $DEFCONFIG_NAME
            make -j$(nproc --all) ARCH=arm64 O=out
          fi

      - name: Empaquetar con AnyKernel3 para TWRP
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Buscar la imagen compilada (Image, Image.gz, Image.gz-dtb, etc.)
          IMAGE_PATH=$(find . \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" \) | head -n 1)
          
          if [ -z "$IMAGE_PATH" ]; then
            echo "Error: No se encontro ninguna imagen compilada del kernel."
            exit 1
          fi
          
          cp "$IMAGE_PATH" AK3/Image
          
          cd AK3
          
          # Configurar AnyKernel3 para SM-A055M
          sed -i 's/device.name1=.*/device.name1=a05/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=a05m/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=SM-A055M/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=SM-A055/g' anykernel.sh
          sed -i 's|block=.*;|block=/dev/block/platform/bootdevice/by-name/boot;|g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=0/g' anykernel.sh
          sed -i 's/ramdisk_compression=.*/ramdisk_compression=auto/g' anykernel.sh

          zip -r9 ../Kernel-A05-Panda-MonitorMode.zip * -x .git README.md *placeholder

      - name: Subir ZIP Flasheable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode-TWRP
          path: Kernel-A05-Panda-MonitorMode.zip
