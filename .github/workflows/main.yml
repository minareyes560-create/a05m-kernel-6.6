name: Compile Galaxy A05 Kernel with Panda AXE3000 WiFi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libelf-dev xz-utils liblz4-tool ccache

    - run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain

    - run: |
        cd kernel-6.6
        DEFCONFIG_FILE=$(find arch/arm64/configs -name "*defconfig" | head -n 1)
        echo "CONFIG_USB_NET_CDC_EEH=y" >> "$DEFCONFIG_FILE"
        echo "CONFIG_MT76=m" >> "$DEFCONFIG_FILE"
        echo "CONFIG_MT76_USB=m" >> "$DEFCONFIG_FILE"
        echo "CONFIG_MT7921_COMMON=m" >> "$DEFCONFIG_FILE"
        echo "CONFIG_MT7921U=m" >> "$DEFCONFIG_FILE"

    - run: |
        export PATH=$(pwd)/toolchain/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        cd kernel-6.6
        make a05m_defconfig
        make -j$(nproc)

    - uses: actions/upload-artifact@v4
      with:
        name: A05-Kernel-Image-Panda
        path: kernel-6.6/arch/arm64/boot/Image.gz
