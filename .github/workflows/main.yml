name: Compilar Kernel Samsung A05 - Modo Monitor Nativomt76

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio del Kernel
        uses: actions/checkout@v4

      - name: Instalación de dependencias y Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl python3 python-is-python3 clang linux-firmware

      - name: Inyectar Configuración y Drivers Nativos MT76
        run: |
          # 1. Encontrar la ruta exacta del defconfig
          CONFIG_PATH=$(find . -type f -name "*a05*defconfig" -o -name "*mt6768*defconfig" | head -n 1)
          
          if [ -z "$CONFIG_PATH" ]; then
            CONFIG_PATH=$(find . -type f -name "*defconfig" | grep -E "vendor|mt" | head -n 1)
          fi
          
          if [ -n "$CONFIG_PATH" ]; then
            DEFCONFIG=$(basename "$CONFIG_PATH")
          else
            echo "Error crítico: No se encontró el defconfig."
            exit 1
          fi

          # 2. Forzar la búsqueda de la carpeta que contienda el Makefile principal del kernel (evitando la de módulos)
          KERNEL_DIR=$(find . -name "Makefile" -exec grep -l "SUBARCH" {} \; | head -n 1 | xargs dirname)
          
          if [ -z "$KERNEL_DIR" ] || [ ! -f "$KERNEL_DIR/Makefile" ]; then
            # Alternativa buscando la carpeta padre de arch/arm64
            KERNEL_DIR=$(dirname $(dirname $(dirname "$CONFIG_PATH")))
          fi

          echo "=========================================="
          echo "Carpeta raíz asegurada: $KERNEL_DIR"
          echo "Defconfig detectado: $DEFCONFIG"
          echo "=========================================="

          cd "$KERNEL_DIR"

      - name: Compilar Imagen del Kernel
        run: |
          # Entrar de forma dinámica a la carpeta donde se configuró 'out'
          cd $(find . -type d -name "out" | head -n 1 | sed 's|/out||') || true
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- Image

      - name: Empaquetar con AnyKernel3 para TWRP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          IMAGE_PATH=$(find . -name "Image" -path "*/out/*" | head -n 1)
          
          if [ -z "$IMAGE_PATH" ]; then
            echo "Error: No se encontró la imagen compilada."
            exit 1
          fi
          
          cp "$IMAGE_PATH" AK3/
          
          cd AK3
          sed -i 's/device.name1=.*/device.name1=a05/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=a05m/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=SM-A055M/g' anykernel.sh
          
          # Forzar la ruta correcta de MediaTek para el boot
          sed -i 's|block=.*;|block=/dev/block/platform/bootdevice/by-name/boot;|g' anykernel.sh
          
          zip -r9 ../Kernel-A05-Panda-MonitorMode.zip * -x .git README.md *placeholder

      - name: Subir ZIP Flasheable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode-TWRP
          path: Kernel-A05-Panda-MonitorMode.zip
