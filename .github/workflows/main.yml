name: Compile Galaxy A05 Base Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev \
          libelf-dev xz-utils liblz4-tool ccache pahole clang lld llvm

    - name: Build Clean Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        cd kernel-6.6
        
        DEFCONFIG_NAME=$(basename $(find arch/arm64/configs -name "*defconfig" | head -n 1))
        
        make ARCH=arm64 CC=clang LD=ld.lld LLVM=1 ${DEFCONFIG_NAME}
        make -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 KCFLAGS="-w"

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: A05-Kernel-Image-Clean
        path: |
          kernel-6.6/arch/arm64/boot/Image.gz
          kernel-6.6/arch/arm64/boot/Image
