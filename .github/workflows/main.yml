name: Compilar Kernel Samsung A05 - Modo Monitor Nativomt76

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio del Kernel
        uses: actions/checkout@v4

      - name: Configurar controladores MT7921U para la antena Panda AXE3000
        run: |
          cd "$GITHUB_WORKSPACE"
          
          # Encontrar la ruta del defconfig del Samsung A05
          DEFCONFIG_PATH=$(find arch/arm64/configs -name "*a05*defconfig" | head -n 1)
          echo "Modificando el archivo de configuracion: $DEFCONFIG_PATH"
          
          # Habilitar soporte inalambrico y stack mac80211
          echo "CONFIG_NET=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_WIRELESS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CFG80211=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CFG80211_DEVELOPER_WARNINGS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CFG80211_CERTIFICATION_ONUS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CFG80211_REQUIRE_SIGNED_REGDB=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CFG80211_DEFAULT_PS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CFG80211_DEBUGFS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_CFG80211_INTERNAL_REGDB=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MAC80211=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MAC80211_HAS_RC=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MAC80211_RC_DEFAULT=\"minstrel_ht\"" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MAC80211_RC_MINSTREL=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MAC80211_MESH=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MAC80211_DEBUGFS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MAC80211_LEDS=y" >> "$DEFCONFIG_PATH"
          
          # Controladores USB Net y MediaTek MT76 / MT7921U (Panda PAU0F / AXE3000)
          echo "CONFIG_USB_NET_DRIVERS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MT76_CORE=m" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MT76_LEDS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MT7921_COMMON=m" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MT7921U=m" >> "$DEFCONFIG_PATH"
          echo "CONFIG_MT76_USB=m" >> "$DEFCONFIG_PATH"

      - name: Empaquetar con AnyKernel3 para TWRP
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          IMAGE_PATH=$(find . -name "Image" -path "*/out/*" | head -n 1)
          cp "$IMAGE_PATH" AK3/
          
          cd AK3
          
          # Configurar propiedades del dispositivo para TWRP
          sed -i 's/device.name1=.*/device.name1=a05/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=a05m/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=SM-A055M/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=SM-A055/g' anykernel.sh
          
          # Forzar ruta de partición boot para MediaTek de Samsung
          sed -i 's|block=.*;|block=/dev/block/platform/bootdevice/by-name/boot;|g' anykernel.sh
          
          sed -i 's/is_slot_device=.*/is_slot_device=0/g' anykernel.sh
          sed -i 's/ramdisk_compression=.*/ramdisk_compression=auto/g' anykernel.sh

          zip -r9 ../Kernel-A05-Panda-MonitorMode.zip * -x .git README.md *placeholder

      - name: Subir ZIP Flasheable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode-TWRP
          path: Kernel-A05-Panda-MonitorMode.zip
