name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget python3 rsync

      - name: Descargar Toolchain Clang de manera estable
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-releases/clang-r450784d.tar.gz -O clang.tar.gz || \
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Configurar drivers Panda AXE3000 (mt76) y Compilar Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          echo "Usando binarios desde: $HOME/clang/bin"
          
          # Entrar al directorio del kernel si está anidado
          if [ -d "a05m-kernel-6.6" ]; then
            cd a05m-kernel-6.6
          elif [ -d "kernel-6.6" ]; then
            cd kernel-6.6
          elif [ -d "kernel" ]; then
            cd kernel
          fi
          
          # Remover KernelSU previo
          rm -rf drivers/kernelsu || true
          if [ -f "drivers/Makefile" ]; then
            sed -i '/kernelsu/d' drivers/Makefile || true
          fi
          if [ -f "drivers/Kconfig" ]; then
            sed -i '/kernelsu/d' drivers/Kconfig || true
          fi

          # Limpieza limpia y creación del directorio de salida
          make ARCH=arm64 clean
          mkdir -p out
          
          # Configuración base GKI en el directorio out
          make O=out ARCH=arm64 gki_defconfig
          
          # Inyectar soporte para Wi-Fi, modo monitor y drivers mt76
          {
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_CFG80211=m"
            echo "CONFIG_MAC80211=m"
            echo "CONFIG_MT76_CORE=m"
            echo "CONFIG_MT76_USB=m"
            echo "CONFIG_MT7921U=m"
          } >> out/.config
          
          # Aplicar nueva configuración
          make O=out ARCH=arm64 olddefconfig
          
          # Compilar el kernel directamente
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: |
            **/out/arch/arm64/boot/Image.lz4
            **/arch/arm64/boot/Image.lz4
            **/out/arch/arm64/boot/Image
            **/arch/arm64/boot/Image
        if: always()
