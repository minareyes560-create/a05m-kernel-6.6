name: Compilar Kernel Samsung A05 - Modo Monitor + Firmware MT76 Completo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio del Kernel
        uses: actions/checkout@v4

      - name: Instalación de dependencias y Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl python3 python-is-python3 clang linux-firmware

      - name: Descargar Firmware MT76 (MediaTek MT7921U) e Inyectar Configuración
        run: |
          cd kernel-6.6 || cd kernel || true
          
          # 1. Descargar e instalar los firmwares binarios actualizados de MediaTek
          sudo mkdir -p /lib/firmware/mediatek
          sudo wget -q -O /lib/firmware/mediatek/WIFI_MT7961_patch_mcu_1_1_hdr.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/WIFI_MT7961_patch_mcu_1_1_hdr.bin"
          sudo wget -q -O /lib/firmware/mediatek/WIFI_RAM_CODE_MT7961_1.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/WIFI_RAM_CODE_MT7961_1.bin"
          
          # 2. Limpieza preventiva
          if [ -f "drivers/Makefile" ]; then
            sed -i '/kernelsu/d' drivers/Makefile || true
            sed -i '/kernelsu/d' drivers/Kconfig || true
            rm -rf drivers/kernelsu || true
          fi
          
          # 3. Anulación total de AFDO / AutoFDO para evitar errores en Makefiles (Línea 1971)
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AFDO_CLANG=y/CONFIG_AFDO_CLANG=n/g' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AUTOFDO_CLANG=y/CONFIG_AUTOFDO_CLANG=n/g' || true
          
          make mrproper || true
          mkdir -p out
          
          # 4. Selección automática del defconfig oficial
          if [ -f "arch/arm64/configs/a05_defconfig" ]; then
            DEFCONFIG="a05_defconfig"
          elif [ -f "arch/arm64/configs/vendor/a05_defconfig" ]; then
            DEFCONFIG="vendor/a05_defconfig"
          elif [ -f "arch/arm64/configs/mt6768_defconfig" ]; then
            DEFCONFIG="mt6768_defconfig"
          else
            DEFCONFIG="gki_defconfig"
          fi
          
          echo "Usando defconfig: $DEFCONFIG"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 $DEFCONFIG
          
          # 5. Inyección de Drivers MT76 + Desactivación de AFDO
          {
            echo "CONFIG_AFDO_CLANG=n"
            echo "CONFIG_AUTOFDO_CLANG=n"
            echo "CONFIG_PROPELLER_CLANG=n"
            echo "CONFIG_PROP_AFDO_PROFILE_PATH=\"\""
            echo "CONFIG_NET=y"
            echo "CONFIG_WIRELESS=y"
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_CFG80211_REQUIRE_SIGNED_REGDB=n"
            echo "CONFIG_CFG80211_USE_KERNEL_REGDB_KEYS=n"
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_MT76_CORE=y"
            echo "CONFIG_MT76_USB=y"
            echo "CONFIG_MT76_CONNAC_LIB=y"
            echo "CONFIG_MT7921_COMMON=y"
            echo "CONFIG_MT7921U=y"
            echo "CONFIG_EXTRA_FIRMWARE=\"mediatek/WIFI_MT7961_patch_mcu_1_1_hdr.bin mediatek/WIFI_RAM_CODE_MT7961_1.bin\""
            echo "CONFIG_EXTRA_FIRMWARE_DIR=\"/lib/firmware\""
          } >> out/.config
          
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 prepare

      - name: Compilar Imagen del Kernel
        run: |
          cd kernel-6.6 || cd kernel || true
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- Image

      - name: Empaquetar con AnyKernel3 para TWRP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          IMAGE_PATH=$(find . -name "Image" -path "*/out/*" | head -n 1)
          
          if [ -z "$IMAGE_PATH" ]; then
            echo "Error: No se encontró la imagen compilada."
            exit 1
          fi
          
          cp "$IMAGE_PATH" AK3/
          
          cd AK3
          sed -i 's/device.name1=.*/device.name1=a05/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=a05m/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=SM-A055M/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/.*/block=\/dev\/block\/by-name\/boot;/g' anykernel.sh
          
          zip -r9 ../Kernel-A05-Panda-MonitorMode.zip * -x .git README.md *placeholder

      - name: Subir ZIP Flasheable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode-TWRP
          path: Kernel-A05-Panda-MonitorMode.zip
