name: Compile Galaxy A05 Base Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libelf-dev xz-utils liblz4-tool ccache pahole clang lld llvm

    - run: |
        cd kernel-6.6
        rm -rf drivers/kernelsu
        mkdir -p drivers/kernelsu
        touch drivers/kernelsu/Kconfig
        if ! grep -q "kernelsu/" drivers/Makefile; then
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
        fi

        # Eliminar las asignaciones de perfil AFDO directo en los archivos de compilación de Samsung
        grep -rl "kernel.afdo" . | xargs -r sed -i 's/.*kernel.afdo.*/# AFDO removed/g'
        grep -rl "fprofile-sample-use" . | xargs -r sed -i 's/-fprofile-sample-use=[^ ]*//g'

    - run: |
        export ARCH=arm64
        export SUBARCH=arm64
        cd kernel-6.6
        DEFCONFIG_NAME=$(basename $(find arch/arm64/configs -name "*defconfig" | head -n 1))
        
        make CC=clang LD=ld.lld ${DEFCONFIG_NAME}
        
        scripts/config --file .config --disable CONFIG_AFDO_PROFILE
        scripts/config --file .config --disable CONFIG_LTO_CLANG_THIN
        scripts/config --file .config --disable CONFIG_LTO_CLANG_FULL
        scripts/config --file .config --enable CONFIG_LTO_NONE
        
        make CC=clang LD=ld.lld olddefconfig
        make -j$(nproc) CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

    - uses: actions/upload-artifact@v4
      with:
        name: A05-Kernel-Image-Base
        path: kernel-6.6/arch/arm64/boot/Image.gz
