name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget python3 rsync cpio

      - name: Descargar Toolchain Clang de Android
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          # Clonar la toolchain oficial de Clang para evitar errores 404 en enlaces tarball directos
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 clang-android
          echo "$HOME/clang/clang-android/llvm/bin" >> $GITHUB_PATH

      - name: Configurar drivers y Compilar Kernel
        run: |
          # Asegurar que el PATH incluya Clang
          export PATH="$HOME/clang/clang-android/llvm/bin:$PATH"
          echo "Usando binarios desde: $(which clang)"
          
          # Ubicar el directorio raíz real del kernel
          KERNEL_DIR=$(find . -maxdepth 4 -name "Makefile" -exec grep -l "VERSION =" {} + | head -n 1 | xargs dirname)
          if [ -n "$KERNEL_DIR" ]; then
            echo "Entrando a: $KERNEL_DIR"
            cd "$KERNEL_DIR"
          fi
          
          # Restablecer por completo el repositorio para eliminar cualquier Makefile dañado o modificado
          git reset --hard
          git clean -fd
          
          # Eliminar KernelSU y limpiar referencias en Kconfig de forma segura
          rm -rf drivers/kernelsu || true
          find drivers/ -type f \( -name "Kconfig*" -o -name "Makefile" \) -exec sed -i '/kernelsu/d' {} + || true

          # Limpieza general del make
          make ARCH=arm64 clean

          # Configuración base GKI
          make ARCH=arm64 gki_defconfig
          
          # Inyectar soporte para Wi-Fi, modo monitor y drivers mt76 para la antena Panda
          {
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_MT76_CORE=y"
            echo "CONFIG_MT76_USB=y"
            echo "CONFIG_MT7921U=y"
          } >> .config
          
          make ARCH=arm64 olddefconfig
          
          # Compilar la imagen con Clang, LLVM y las herramientas cruzadas correctas
          make -j$(nproc) ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: |
            **/arch/arm64/boot/Image.lz4
            **/arch/arm64/boot/Image
            **/out/arch/arm64/boot/Image
        if: always()
