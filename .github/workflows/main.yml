name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl

      - name: Descargar Toolchain Clang de manera estable
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main.tar.gz -O clang.tar.gz || \
          wget https://gitlab.com/LeLithium/clang-standalone/-/raw/main/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Configurar Kernel y Compilar Modo Monitor
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          echo "Usando binarios desde: $HOME/clang/bin"
          
          # 1. Ubicar correctamente la carpeta del kernel
          if [ -d "kernel-6.6/kernel-6.6" ]; then
            cd kernel-6.6/kernel-6.6
          elif [ -d "kernel-6.6" ]; then
            cd kernel-6.6
          elif [ -d "kernel" ]; then
            cd kernel
          else
            cd .
          fi
          
          echo "Directorio actual de trabajo: $(pwd)"
          
          # 2. Limpiar referencias y archivos residuales
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true
          rm -rf drivers/kernelsu || true
          make mrproper
          
          # 3. Crear directorio out y generar configuración base GKI
          mkdir -p out
          make O=out ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- gki_defconfig
          
          # 4. Inyectar soporte nativo de red y modo monitor en el kernel
          {
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_CFG80211=m"
            echo "CONFIG_MAC80211=m"
            echo "CONFIG_NL80211_TESTMODE=y"
          } >> out/.config
          
          # 5. Actualizar configuración y compilar la imagen limpia del kernel
          make O=out ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          make -j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- Image

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: |
            **/out/arch/arm64/boot/Image.lz4
            **/arch/arm64/boot/Image.lz4
            **/out/arch/arm64/boot/Image
            **/arch/arm64/boot/Image
        if: always()
