name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip

      - name: Descargar Toolchain Clang
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/refs/heads/main/clang-r488900 --depth=1 ~/clang

      - name: Configurar drivers Panda AXE3000 (mt76)
        run: |
          make ARCH=arm64 gki_defconfig
          echo "CONFIG_NETDEVICES=y" >> .config
          echo "CONFIG_WLAN=y" >> .config
          echo "CONFIG_NL80211_TESTMODE=y" >> .config
          echo "CONFIG_CFG80211=m" >> .config
          echo "CONFIG_MAC80211=m" >> .config
          echo "CONFIG_MT76_CORE=m" >> .config
          echo "CONFIG_MT76_USB=m" >> .config
          echo "CONFIG_MT7921U=m" >> .config

      - name: Compilar Kernel
        run: |
          export PATH=~/clang/bin:$PATH
          make -j$(nproc) ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: out/arch/arm64/boot/Image.lz4
