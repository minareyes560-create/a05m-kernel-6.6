name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl

      - name: Descargar Toolchain Clang oficial y estable (AOSP)
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          # Usamos un toolchain de Clang de AOSP más reciente y compatible con kernels GKI modernos
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784e.tar.gz -O clang.tar.gz || \
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Configurar drivers Panda AXE3000 (mt76) y Compilar Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export HOSTCC=clang
          export HOSTCXX=clang++
          export CC=clang
          
          echo "Usando binarios desde: $HOME/clang/bin"
          
          # Entrar al directorio del kernel
          cd kernel-6.6 || cd kernel || cd .
          
          # Limpiar referencias de KernelSU y archivos residuales
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true
          rm -rf drivers/kernelsu || true
          make mrproper
          
          # Configuración base GKI para ARM64
          make ARCH=arm64 gki_defconfig
          
          # Inyectar soporte para Wi-Fi y los drivers mt76 / mt7921u de la antena
          {
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_CFG80211=m"
            echo "CONFIG_MAC80211=m"
            echo "CONFIG_MT76_CORE=m"
            echo "CONFIG_MT76_USB=m"
            echo "CONFIG_MT7921U=m"
          } >> arch/arm64/configs/gki_defconfig
          
          make ARCH=arm64 gki_defconfig
          
          # Compilar la imagen del kernel corrigiendo las rutas de LLVM y el ensamblador
          make -j$(nproc) ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.lz4 Image

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: |
            **/out/arch/arm64/boot/Image.lz4
            **/arch/arm64/boot/Image.lz4
            **/out/arch/arm64/boot/Image
            **/arch/arm64/boot/Image
        if: always()
