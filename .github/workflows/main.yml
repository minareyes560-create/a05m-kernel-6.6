name: Compilar Kernel A05 Modo Monitor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl python3 python-is-python3

      - name: Descargar Toolchain Clang
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main.tar.gz -O clang.tar.gz || \
          wget https://gitlab.com/LeLithium/clang-standalone/-/raw/main/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Configurar drivers Panda AXE3000 y Compilar Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          echo "Usando binarios desde: $HOME/clang/bin"
          
          # Entrar al directorio del kernel
          cd kernel-6.6 || cd kernel || cd .
          
          # Limpiar referencias de KernelSU y residuos de compilaciones anteriores
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true
          rm -rf drivers/kernelsu || true
          make mrproper
          
          # Generar la configuración base en la carpeta out
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # Desactivar AFDO (solución al fallo empty.o/kernel.afdo) e inyectar drivers de la antena Panda
          {
            echo "CONFIG_AFDO_CLANG=n"
            echo "CONFIG_AUTOFDO_CLANG=n"
            echo "CONFIG_PROP_AFDO_PROFILE_PATH=\"\""
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_CFG80211=m"
            echo "CONFIG_MAC80211=m"
            echo "CONFIG_MT76_CORE=m"
            echo "CONFIG_MT76_USB=m"
            echo "CONFIG_MT7921U=m"
          } >> out/.config
          
          # Consolidar configuración y preparar dependencias internas
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 prepare
          
          # Compilar la imagen del Kernel
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- Image

      - name: Subir Kernel listo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode
          path: |
            **/out/arch/arm64/boot/Image
            **/arch/arm64/boot/Image
        if: always()
