name: Compilar Kernel Samsung A05 - Eros Tool / AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio del Kernel
        uses: actions/checkout@v4

      - name: Instalación de dependencias y Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl python3 python-is-python3 clang linux-firmware

      - name: Inyectar Configuración y Drivers Nativos MT76
        run: |
          cd a05m-kernel-6.6/kernel-6.6 || cd kernel-6.6 || cd kernel || true
          
          # Limpieza radical de KernelSU
          rm -rf drivers/kernelsu || true
          find . -name "Kconfig*" -o -name "Makefile" | xargs sed -i '/kernelsu/d' || true
          
          # Anulación de AFDO
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AFDO_CLANG=y/CONFIG_AFDO_CLANG=n/g' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AUTOFDO_CLANG=y/CONFIG_AUTOFDO_CLANG=n/g' || true
          
          make mrproper || true
          mkdir -p out
          
          if [ -f "arch/arm64/configs/a05_defconfig" ]; then
            DEFCONFIG="a05_defconfig"
          elif [ -f "arch/arm64/configs/vendor/a05_defconfig" ]; then
            DEFCONFIG="vendor/a05_defconfig"
          elif [ -f "arch/arm64/configs/exynos*defconfig" ] || [ -f "arch/arm64/configs/mt*" ]; then
            DEFCONFIG=$(ls arch/arm64/configs/ | grep -E "a05|mt6768" | head -n 1)
          else
            DEFCONFIG="gki_defconfig"
          fi
          
          echo "Usando defconfig: $DEFCONFIG"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 $DEFCONFIG
          
          # Configuración optimizada para evitar errores de compilación y habilitar soporte USB/WLAN
          {
            echo "CONFIG_AFDO_CLANG=n"
            echo "CONFIG_AUTOFDO_CLANG=n"
            echo "CONFIG_PROPELLER_CLANG=n"
            echo "CONFIG_PROP_AFDO_PROFILE_PATH=\"\""
            echo "CONFIG_NET=y"
            echo "CONFIG_WIRELESS=y"
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_CFG80211_REQUIRE_SIGNED_REGDB=n"
            echo "CONFIG_CFG80211_USE_KERNEL_REGDB_KEYS=n"
            echo "CONFIG_NL80211_TESTMODE=y"
            echo "CONFIG_USB=y"
            echo "CONFIG_USB_SUPPORT=y"
            echo "CONFIG_MT76_CORE=m"
            echo "CONFIG_MT76_USB=m"
            echo "CONFIG_MT76_CONNAC_LIB=m"
            echo "CONFIG_MT7921_COMMON=m"
            echo "CONFIG_MT7921U=m"
          } >> out/.config
          
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compilar Imagen del Kernel y Módulos
        run: |
          cd a05m-kernel-6.6/kernel-6.6 || cd kernel-6.6 || cd kernel || true
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- Image
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- modules

      - name: Preparar Artefacto para Eros Tool / AnyKernel3
        run: |
          # Crear directorio absoluto de salida
          mkdir -p "$GITHUB_WORKSPACE/ErosOutput"
          
          IMAGE_PATH=$(find . -name "Image" -path "*/out/*" | head -n 1)
          
          if [ -z "$IMAGE_PATH" ]; then
            echo "Error: No se encontró la imagen compilada."
            exit 1
          fi
          
          echo "Imagen encontrada en: $IMAGE_PATH"
          
          # 1. Generar el ZIP para Recovery Custom (AnyKernel3) si existe la carpeta
          if [ -d "AnyKernel3" ]; then
            echo "Integrando kernel con AnyKernel3..."
            cp "$IMAGE_PATH" AnyKernel3/Image
            cd AnyKernel3
            zip -r9 "$GITHUB_WORKSPACE/ErosOutput/Kernel-A05-Flashable.zip" * -x "*.git*"
            cd "$GITHUB_WORKSPACE"
          fi
          
          # 2. Copiar la imagen a un archivo temporal en la salida absoluta
          cp "$IMAGE_PATH" "$GITHUB_WORKSPACE/ErosOutput/boot.img"
          
          # 3. Generar boot.tar usando rutas absolutas sin enredos de directorios
          echo "Generando boot.tar..."
          cd "$GITHUB_WORKSPACE/ErosOutput"
          tar --format=ustar -cvf boot.tar boot.img
          
          # 4. Generar Kernel-A05-Flashable.tar directamente en la misma carpeta absoluta
          echo "Generando Kernel-A05-Flashable.tar..."
          cp boot.img kernel_temp.img
          tar --format=ustar -cvf Kernel-A05-Flashable.tar kernel_temp.img
          
          # Limpiar archivos temporales y volver a la raíz
          rm -f boot.img kernel_temp.img
          cd "$GITHUB_WORKSPACE"

      - name: Subir Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-ErosTool
          path: ErosOutput/
