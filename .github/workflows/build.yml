name: Compilar Kernel Samsung A05 - Eros Tool

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio del Kernel
        uses: actions/checkout@v4

      - name: Instalación de dependencias y Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl python3 python-is-python3 clang linux-firmware

      - name: Compilar Kernel e Inyectar Drivers MT76
        run: |
          # Entrar directo a la ruta real de tu repositorio
          cd kernel-6.6/kernel-6.6

          # Limpieza profunda de residuos
          rm -rf drivers/kernelsu || true
          find . -name "Kconfig*" -o -name "Makefile" | xargs sed -i '/kernelsu/d' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AFDO_CLANG=y/CONFIG_AFDO_CLANG=n/g' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AUTOFDO_CLANG=y/CONFIG_AUTOFDO_CLANG=n/g' || true

          make mrproper || true
          mkdir -p out

          # Usar gki_defconfig que es el que realmente existe en este repositorio base
          echo "Usando defconfig base: gki_defconfig"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig

          # Verificación estricta de que el archivo .config se creó correctamente
          if [ ! -f "out/.config" ]; then
            echo "Error crítico: El archivo out/.config no se generó."
            exit 1
          fi

          # Inyección segura de parámetros de red y drivers mt76 para el adaptador Wi-Fi
          {
            echo "CONFIG_AFDO_CLANG=n"
            echo "CONFIG_AUTOFDO_CLANG=n"
            echo "CONFIG_NET=y"
            echo "CONFIG_WIRELESS=y"
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_MT76_CORE=y"
            echo "CONFIG_MT76_USB=y"
            echo "CONFIG_MT7921U=y"
          } >> out/.config

          # Sincronización limpia para evitar errores de dependencias
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 oldconfig < /dev/null
          
          # Compilación de la imagen
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- Image

          # Guardar la ruta actual para el siguiente paso
          pwd > /tmp/build_path

      - name: Crear Tarball y Firma MD5 exacta para Eros Tool
        run: |
          BUILD_DIR=$(cat /tmp/build_path)
          cd "$BUILD_DIR"
          
          IMAGE_PATH=$(find out -name "Image" | head -n 1)
          
          if [ -z "$IMAGE_PATH" ]; then
            echo "Error: No se encontró la imagen Image compilada."
            exit 1
          fi

          mkdir -p eros_pkg
          cp "$IMAGE_PATH" eros_pkg/boot.img
          
          cd eros_pkg
          tar -H ustar -c boot.img > ../boot.tar
          md5sum boot.tar | awk '{print $1}' | tr -d '\n' >> ../boot.tar
          mv ../boot.tar ../Kernel-A05-Panda-MonitorMode-Eros.tar.md5
          cd ..
          cp Kernel-A05-Panda-MonitorMode-Eros.tar.md5 ../..

      - name: Subir Archivo .tar.md5 Real
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-MonitorMode-Eros
          path: Kernel-A05-Panda-MonitorMode-Eros.tar.md5
