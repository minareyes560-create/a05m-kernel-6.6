name: Build Kernel 6.6 for Samsung Galaxy A05

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup environment and toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git wget zip lz4

      - name: Clean, Remove KernelSU dependency and Compile
        run: |
          echo "Iniciando limpieza profunda, eliminando KernelSU y compilando..."
          cd kernel-6.6
          
          # Limpieza profunda de residuos de KernelSU
          rm -rf drivers/kernelsu || true
          find . -name "Kconfig*" -o -name "Makefile" | xargs sed -i '/kernelsu/d' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AFDO_CLANG=y/CONFIG_AFDO_CLANG=n/g' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AUTOFDO_CLANG=y/CONFIG_AUTOFDO_CLANG=n/g' || true

          # Eliminar cualquier rastro de configuración de KernelSU en los defconfigs base
          find arch/arm64/configs/ -type f | xargs sed -i '/CONFIG_KSU/d' || true

          sed -i '/kernelsu/d' drivers/Kconfig || true

          make mrproper || true
          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=== Listando archivos defconfig disponibles en el repositorio ==="
          ls -l arch/arm64/configs/

          # Detección inteligente del defconfig real disponible
          DEFCONFIG=$(ls arch/arm64/configs/ | grep -E "a05|a05m|mt6769|gki" | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            # Si no encuentra coincidencia, toma el primer archivo .defconfig disponible
            DEFCONFIG=$(ls arch/arm64/configs/ | grep "_defconfig" | head -n 1)
          fi
          
          echo "Usando defconfig detectado: $DEFCONFIG"

          make O=out $DEFCONFIG
          make O=out -j$(nproc)

      - name: Setup AnyKernel3 and Package safely
        run: |
          # Copiar la imagen compilada asegurando la ruta correcta
          cp kernel-6.6/out/arch/arm64/boot/Image AnyKernel3/Image
          
          cd AnyKernel3
          rm -rf .git
          zip -r9 ../A05M-Kernel-6.6-AnyKernel3.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A05M-Kernel-6.6-AnyKernel3
          path: A05M-Kernel-6.6-AnyKernel3.zip
