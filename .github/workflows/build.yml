name: Compilar Kernel Samsung A05 y Empaquetar AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio y submódulos
        uses: actions/checkout@v4

      - name: Instalación de dependencias y Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl python3 python-is-python3 clang linux-firmware

      - name: Compilar Kernel e Inyectar Drivers MT76
        run: |
          cd kernel-6.6

          # Limpieza profunda de residuos
          rm -rf drivers/kernelsu || true
          find . -name "Kconfig*" -o -name "Makefile" | xargs sed -i '/kernelsu/d' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AFDO_CLANG=y/CONFIG_AFDO_CLANG=n/g' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AUTOFDO_CLANG=y/CONFIG_AUTOFDO_CLANG=n/g' || true

          make mrproper || true
          mkdir -p out

          # Configuración base para GKI ARM64
          echo "Usando defconfig base: gki_defconfig"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig

          if [ ! -f "out/.config" ]; then
            echo "Error crítico: El archivo out/.config no se generó."
            exit 1
          fi

          # Inyección de parámetros de red y drivers USB Wi-Fi
          {
            echo "CONFIG_AFDO_CLANG=n"
            echo "CONFIG_AUTOFDO_CLANG=n"
            echo "CONFIG_NET=y"
            echo "CONFIG_WIRELESS=y"
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_MT76_CORE=y"
            echo "CONFIG_MT76_USB=y"
            echo "CONFIG_MT7921U=y"
          } >> out/.config

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

          # Compilación usando todos los hilos disponibles
          echo "Iniciando compilación del kernel..."
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Preparar y empaquetar con AnyKernel3
        run: |
          # Regresar a la raíz del workspace
          cd ..

          # Verificar que se generó la imagen compilada
          if [ ! -f "kernel-6.6/out/arch/arm64/boot/Image" ]; then
            echo "Error: No se encontró la imagen compilada del kernel."
            exit 1
          fi

          # Copiar la nueva imagen compilada a la carpeta AnyKernel3
          cp kernel-6.6/out/arch/arm64/boot/Image AnyKernel3/Image

          # Opcional: Asegurar permisos en la carpeta AnyKernel3
          chmod -R 755 AnyKernel3

          # Crear el ZIP flasheable final
          cd AnyKernel3
          zip -r9 ../Samsung-A05-Kernel-MT7921U.zip *

          echo "¡Empaquetado completado con éxito!"

      - name: Subir Artifact (ZIP para flashear)
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A05-Kernel-MT7921U
          path: Samsung-A05-Kernel-MT7921U.zip
