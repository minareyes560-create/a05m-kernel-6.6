name: Compilar Kernel Samsung A05 y Empaquetar AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio y submódulos
        uses: actions/checkout@v4

      - name: Instalación de dependencias y Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl python3 python-is-python3 clang linux-firmware

      - name: Compilar Kernel e Inyectar Drivers MT76
        run: |
          # Posicionarse limpiamente en la carpeta del kernel
          cd kernel-6.6

          # Limpieza estricta de residuos y referencias a KernelSU
          rm -rf drivers/kernelsu || true
          if [ -f "drivers/Kconfig" ]; then
            sed -i '/kernelsu/d' drivers/Kconfig || true
          fi

          # Preparar directorio de compilación
          make mrproper || true
          rm -rf out
          mkdir -p out

          # Cargar la configuración base limpia de GKI
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig

          # Inyección de parámetros de red, criptografía y drivers USB Wi-Fi MediaTek
          {
            echo "CONFIG_NET=y"
            echo "CONFIG_WIRELESS=y"
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_CRYPTO_HASH=y"
            echo "CONFIG_CRYPTO_SHA1=y"
            echo "CONFIG_CRYPTO_AES=y"
            echo "CONFIG_MT76_CORE=y"
            echo "CONFIG_MT76_USB=y"
            echo "CONFIG_MT7921U=y"
          } >> out/.config

          # Sincronizar dependencias de configuración automáticamente
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

          # Compilar el kernel
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Preparar y empaquetar con AnyKernel3
        run: |
          echo "Buscando la imagen del kernel compilada..."
          
          # Buscar de manera dinámica el archivo Image generado
          KERNEL_IMAGE=$(find "$GITHUB_WORKSPACE" -name "Image" -not -path "*/AnyKernel3/*" | head -n 1)

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "Error crítico: No se encontró ningún archivo 'Image' compilado en el workspace."
            exit 1
          fi

          echo "¡Imagen encontrada con éxito en: $KERNEL_IMAGE"

          # Ubicar carpeta AnyKernel3
          ANYKERNEL_DIR=$(find "$GITHUB_WORKSPACE" -type d -name "AnyKernel3" | head -n 1)

          if [ -z "$ANYKERNEL_DIR" ]; then
            echo "Error crítico: No se encontró la carpeta AnyKernel3 en el repositorio."
            exit 1
          fi

          echo "Carpeta AnyKernel3 encontrada en: $ANYKERNEL_DIR"

          # Copiar imagen del kernel
          cp "$KERNEL_IMAGE" "$ANYKERNEL_DIR/Image"

          # Verificar existencia de boot.img
          if [ ! -f "$ANYKERNEL_DIR/boot.img" ]; then
            echo "Error crítico: El archivo boot.img no está dentro de la carpeta AnyKernel3."
            exit 1
          fi

          # Dar permisos de ejecución
          chmod -R 755 "$ANYKERNEL_DIR"

          # Crear el ZIP final
          cd "$ANYKERNEL_DIR"
          zip -r9 "$GITHUB_WORKSPACE/Samsung-A05-Kernel-MT7921U.zip" *

          echo "¡Empaquetado completado con éxito!"

      - name: Subir Artifact (ZIP para flashear)
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A05-Kernel-MT7921U
          path: Samsung-A05-Kernel-MT7921U.zip
