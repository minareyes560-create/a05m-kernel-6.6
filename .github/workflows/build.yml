name: Compilar Kernel Samsung A05 con Drivers MT76 Nativos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio del Kernel
        uses: actions/checkout@v4

      - name: Instalación de dependencias y Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev zip git lld llvm libelf-dev wget kmod cpio perl python3 python-is-python3 clang linux-firmware lz4

      - name: Compilar Kernel e Inyectar Drivers MT76
        run: |
          cd kernel-6.6

          # Limpieza profunda de residuos previos
          rm -rf drivers/kernelsu || true
          find . -name "Kconfig*" -o -name "Makefile" | xargs sed -i '/kernelsu/d' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AFDO_CLANG=y/CONFIG_AFDO_CLANG=n/g' || true
          find . -name "Makefile" -o -name "Kconfig*" | xargs sed -i 's/CONFIG_AUTOFDO_CLANG=y/CONFIG_AUTOFDO_CLANG=n/g' || true

          make mrproper || true
          mkdir -p out

          # Búsqueda inteligente del defconfig exacto para MediaTek / A05
          DEFCONFIG=""
          for cfg in a05_defconfig a05m_defconfig mt6768_defconfig gki_defconfig; do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              DEFCONFIG="$cfg"
              break
            fi
          done
          
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="gki_defconfig"
          fi

          echo "Usando configuración detectada: $DEFCONFIG"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 $DEFCONFIG

          # Inyección estricta de los drivers mt76 y soporte inalambrico nativo (=y)
          {
            echo "CONFIG_AFDO_CLANG=n"
            echo "CONFIG_AUTOFDO_CLANG=n"
            echo "CONFIG_NET=y"
            echo "CONFIG_WIRELESS=y"
            echo "CONFIG_NETDEVICES=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_MT76_CORE=y"
            echo "CONFIG_MT76_USB=y"
            echo "CONFIG_MT7921U=y"
          } >> out/.config

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 oldconfig < /dev/null
          
          # Compilación optimizada para el kernel e imagen compatible con MediaTek
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- Image

          pwd > /tmp/build_path

      - name: Empaquetar con AnyKernel3 y boot.img.lz4 original
        run: |
          BUILD_DIR=$(cat /tmp/build_path)
          cd "$BUILD_DIR"
          
          IMAGE_PATH=$(find out -name "Image" | head -n 1)
          
          if [ -z "$IMAGE_PATH" ]; then
            echo "Error: No se encontró la imagen Image compilada."
            exit 1
          fi

          # Asegurar la ruta absoluta de AnyKernel3 sin importar la ubicación actual
          ANYKERNEL_DIR="$BUILD_DIR/AnyKernel3"
          if [ ! -d "$ANYKERNEL_DIR" ]; then
            ANYKERNEL_DIR="$GITHUB_WORKSPACE/AnyKernel3"
          fi

          # Copiar la nueva imagen compilada a la carpeta AnyKernel3
          cp "$IMAGE_PATH" "$ANYKERNEL_DIR/Image"

          # Descomprimir el boot.img.lz4 original para que AnyKernel3 lo utilice de base limpia
          cd "$ANYKERNEL_DIR"
          if [ -f "boot.img.lz4" ]; then
            lz4 -d boot.img.lz4 boot.img || unlz4 boot.img.lz4 || true
          fi

          # Crear el archivo zip final para flashear por TWRP sin bucles de arranque
          zip -r9 "$GITHUB_WORKSPACE/Kernel-A05-Panda-AnyKernel3.zip" * -x ".git*" README.md

      - name: Subir Artifact del Kernel Flasheable
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A05-Panda-AnyKernel3
          path: Kernel-A05-Panda-AnyKernel3.zip
