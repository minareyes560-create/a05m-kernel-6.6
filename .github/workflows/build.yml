- name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Entrar a la carpeta correcta del código fuente que se ve en tu repositorio
          cd kernel-6.6 || cd kernel || true
          
          DEFCONFIG_NAME=$(basename $(find . -name "*defconfig*" | head -n 1))
          
          echo "Generando configuraciones en $(pwd)..."
          make O=out $DEFCONFIG_NAME
          
          echo "Iniciando compilación del kernel..."
          make O=out -j$(nproc)
