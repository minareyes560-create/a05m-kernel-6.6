name: Build Kernel 6.6 for Samsung Galaxy A05

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup environment and toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git wget zip lz4

      - name: Compile Kernel
        run: |
          echo "Compilando kernel 6.6 para a05m..."
          # Comandos reales de compilación para generar out/arch/arm64/boot/Image
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out defconfig
          make O=out -j$(nproc)

      - name: Setup AnyKernel3 and Package safely
        run: |
          # 1. Copiar la imagen del kernel compilado a la carpeta AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          
          # 2. Entrar a la carpeta AnyKernel3 para trabajar de manera limpia
          cd AnyKernel3
          
          # 3. Eliminar rastros de git internos para evitar corrupción en el empaquetado
          rm -rf .git
          
          # 4. Crear el archivo ZIP flasheable final listo para TWRP
          zip -r9 ../A05M-Kernel-6.6-AnyKernel3.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A05M-Kernel-6.6-AnyKernel3
          path: A05M-Kernel-6.6-AnyKernel3.zip
