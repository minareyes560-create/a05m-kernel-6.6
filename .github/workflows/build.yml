name: Build Kernel 6.6 for Samsung Galaxy A05

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup environment and toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git wget zip lz4

      - name: Remove KernelSU dependency and Compile
        run: |
          echo "Quitando referencia de KernelSU y compilando..."
          cd kernel-6.6
          
          # Esto elimina la línea que busca drivers/kernelsu/Kconfig para que no dé error
          sed -i '/kernelsu/d' drivers/Kconfig || true
          
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out a05m_defconfig
          make O=out -j$(nproc)

      - name: Setup AnyKernel3 and Package safely
        run: |
          # Copiar la imagen compilada asegurando la ruta correcta
          cp kernel-6.6/out/arch/arm64/boot/Image AnyKernel3/Image
          
          cd AnyKernel3
          rm -rf .git
          zip -r9 ../A05M-Kernel-6.6-AnyKernel3.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A05M-Kernel-6.6-AnyKernel3
          path: A05M-Kernel-6.6-AnyKernel3.zip
